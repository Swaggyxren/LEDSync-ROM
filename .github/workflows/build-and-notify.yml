name: Build Android APK & Telegram Notify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Notify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "89339e075775f199293ccf97f9e29ad701ac1e5d\n7a9331941639fede0e88f335250d36742e7bfe7c\n24333f8a6378b6e4d16d4f6f9e51626c68d67555\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne984671924535cd86243142109477d1091c43010" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'ledsync123' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'ledsync' }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD || 'ledsync123' }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/ledsync-release.keystore
            echo "Release keystore decoded from repository secret."
          else
            echo "RELEASE_KEYSTORE_BASE64 not provided. Generating dedicated release keystore for CI signing..."
            keytool -genkeypair -v \
              -keystore app/ledsync-release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=LEDSync-ROM, OU=System, O=Swaggyxren, C=US"
            echo "Release keystore generated successfully."
          fi

      - name: Extract App Version
        id: appver
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ledsync-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'ledsync123' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'ledsync' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'ledsync123' }}
          APP_VERSION: ${{ steps.appver.outputs.name }}
          BUILD_SHA: ${{ steps.appver.outputs.sha }}
        run: |
          ./gradlew assembleRelease --no-daemon
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ]; then
            cp "$RAW_APK" "app/build/outputs/apk/release/LEDSync-ROM-v${APP_VERSION}-${BUILD_SHA}-release.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDSync-ROM-v${{ steps.appver.outputs.name }}-${{ steps.appver.outputs.sha }}-release-apk
          path: app/build/outputs/apk/release/LEDSync-ROM-v${{ steps.appver.outputs.name }}-${{ steps.appver.outputs.sha }}-release.apk
          if-no-files-found: error

      - name: Send Telegram Notification & APK
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_VERSION: ${{ steps.appver.outputs.name }}
          BUILD_SHA: ${{ steps.appver.outputs.sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram bot token or chat ID secret is not set. Skipping Telegram notification."
            exit 0
          fi

          SHORT_SHA="$BUILD_SHA"
          RAW_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          CLEAN_COMMIT_MSG=$(echo "$RAW_COMMIT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          BRANCH_NAME="${GITHUB_REF_NAME:-unknown}"
          JOB_STATUS="${{ job.status }}"

          APK_PATH="app/build/outputs/apk/release/LEDSync-ROM-v${APP_VERSION}-${BUILD_SHA}-release.apk"

          if [ "$JOB_STATUS" = "success" ] && [ -f "$APK_PATH" ]; then
            CAPTION=$(printf "🚀 <b>LEDSync-ROM v%s Release Build Success</b>\n\n📌 <b>Commit:</b> <code>%s</code>\n📝 <b>Message:</b> %s\n👤 <b>Author:</b> %s\n🌿 <b>Branch:</b> %s" "$APP_VERSION" "$SHORT_SHA" "$CLEAN_COMMIT_MSG" "$COMMIT_AUTHOR" "$BRANCH_NAME")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"${APK_PATH}" \
              -F caption="${CAPTION}" \
              -F parse_mode="HTML")
            echo "Telegram API Response: $RESPONSE"
          else
            CAPTION=$(printf "❌ <b>LEDSync-ROM Release Build Failed</b>\n\n📌 <b>Commit:</b> <code>%s</code>\n📝 <b>Message:</b> %s\n👤 <b>Author:</b> %s\n🌿 <b>Branch:</b> %s" "$SHORT_SHA" "$CLEAN_COMMIT_MSG" "$COMMIT_AUTHOR" "$BRANCH_NAME")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${CAPTION}" \
              -d parse_mode="HTML")
            echo "Telegram API Response: $RESPONSE"
          fi
